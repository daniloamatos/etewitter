{% load crispy_forms_tags %}
{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha · Etewitter</title>
    <link href="{% static 'css/styles.css' %}?v=20261017" rel="stylesheet">
    <link href="{% static 'css/login/logincss.css' %}?v=20261015" rel="stylesheet">
</head>
<body>
<main class="auth-screen">
    <section class="auth-card">
        <a class="auth-brand" href="/"><span class="brand-mark">t</span><strong>etewitter</strong></a>
        <h1>Encontre sua conta</h1>
        <p class="auth-help">Informe o email cadastrado e enviaremos as instruções de recuperação.</p>
        <form method="post">
            {% csrf_token %}
            <label for="email">Email</label>
            <input class="auth-input" id="email" name="email" type="email" placeholder="seu@email.com" required>
            <button class="tweetBtn" type="submit">Enviar instruções</button>
        </form>
        {% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}
        <div class="auth-links"><a href="/login/">Voltar para o login</a></div>
    </section>
</main>
</body>
</html>
