{% load crispy_forms_tags %}
{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Etewitter</title>
    <link href="{% static 'css/styles.css' %}?v=20261017" rel="stylesheet">
    <link href="{% static 'css/login/logincss.css' %}?v=20261015" rel="stylesheet">
</head>
<body>
<main class="auth-screen">
    <section class="auth-card">
        <a class="auth-brand" href="/"><span class="brand-mark">t</span><strong>etewitter</strong></a>
        <h1>Entre na sua conta</h1>
        <form method="post">
            {% csrf_token %}{{ form|crispy }}
            <button class="tweetBtn" type="submit">Entrar</button>
        </form>
        {% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}
        <div class="auth-links"><a href="/register/">Criar conta</a><a href="/forgotpass/">Esqueci minha senha</a></div>
    </section>
</main>
</body>
</html>
