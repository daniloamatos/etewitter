{% load static %}<a class="profile-avatar-link" href="/{{ person.username }}/" aria-label="Perfil de @{{ person.username }}"><img class="avatar avatar-image" src="{% if person.profilepic and person.profilepic.name != 'default/default_profile_400x400.png' %}{{ person.profilepic.url }}{% else %}{% static 'images/default-profile.svg' %}{% endif %}" alt="Foto de {{ person.name }}"></a>
