{% load static i18n %}<a class="profile-avatar-link" href="/{{ person.username }}/" aria-label="{% blocktrans with handle=person.username %}Perfil de @{{ handle }}{% endblocktrans %}"><img class="avatar avatar-image" src="{% if person.profilepic and person.profilepic.name != 'default/default_profile_400x400.png' %}{{ person.profilepic.url }}{% else %}{% static 'images/default-profile.svg' %}{% endif %}" alt="{% blocktrans with name=person.name %}Foto de {{ name }}{% endblocktrans %}"></a>
